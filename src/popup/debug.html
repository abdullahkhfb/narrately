<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Narrately Debug</title>
  <link rel="stylesheet" href="./popup.css">
  <link rel="stylesheet" href="./debug.css">
</head>
<body class="debug-page">
  <header>
    <span class="logo" id="logo" aria-hidden="true"></span>
    <div>
      <strong>Narrately</strong>
      <small>Debug helper</small>
    </div>
    <span id="debug-count" class="count">0 logs</span>
  </header>
  <main>
    <section id="debug-view" aria-label="Captured Narrately logs">
      <div id="debug-log" class="log" role="log" tabindex="0" aria-label="Captured Narrately logs"></div>
      <div class="debug-actions">
        <button id="copy-errors" class="primary" type="button">Copy logs</button>
        <button id="clear-errors" class="quiet" type="button">Clear</button>
        <span class="spacer"></span>
        <a
          class="support-button"
          href="https://github.com/abdullahkhfb/narrately/issues/new?template=bug_report.yml"
          target="_blank"
          rel="noopener noreferrer"
        >Report a bug</a>
      </div>
      <p id="debug-status" role="status" aria-live="polite"></p>
      <p class="privacy-note">Check logs before sharing: details can include page URLs.</p>
    </section>
  </main>
  <script type="module" src="./debug.ts"></script>
</body>
</html>
