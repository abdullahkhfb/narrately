<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Narrately</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <header class="top">
    <span class="logo" id="logo" aria-hidden="true"></span>
    <div class="brand">
      <strong>Narrately <span class="beta" id="beta" hidden>Beta</span></strong>
      <small id="version">Local novel narrator</small>
    </div>
    <span class="saved" id="saved" role="status" aria-live="polite"></span>
  </header>
  <main>
    <section id="settings-view">
      <button id="open" class="primary" type="button">Narrate this page</button>
      <p id="status" role="status" aria-live="polite"></p>

      <div class="row">
        <label class="field grow">
          <span class="label">Voice</span>
          <select id="voice"></select>
        </label>
        <div class="field">
          <span class="label">Speed</span>
          <input id="speed" type="hidden" value="1">
          <div class="chips" id="speed-chips" role="group" aria-label="Speed">
            <button type="button" data-speed="1" aria-pressed="false">1×</button>
            <button type="button" data-speed="1.25" aria-pressed="false">1.25×</button>
            <button type="button" data-speed="1.5" aria-pressed="false">1.5×</button>
          </div>
        </div>
      </div>

      <div class="field">
        <span class="label">Engine</span>
        <div class="segmented" id="device" role="radiogroup" aria-label="Processing device">
          <label><input type="radio" name="device" value="wasm" checked><span>Compatible</span></label>
          <label><input type="radio" name="device" value="webgpu"><span>Fast (WebGPU)</span></label>
        </div>
        <p class="hint" id="device-hint">Works on every computer. Downloads an 88 MB voice model once.</p>
      </div>

      <label class="switch">
        <span class="switch-text"><b>Remember narrated chapters</b><small>Replay instantly. Uses disk space.</small></span>
        <input id="cache" type="checkbox" checked>
        <span class="track" aria-hidden="true"></span>
      </label>

      <div class="card">
        <div class="card-head">
          <span>Storage · <strong id="summary-total">…</strong></span>
          <button id="storage-open" class="link" type="button">Manage</button>
        </div>
        <div class="meter" id="summary-meter" role="img" aria-label="Storage in use">
          <span id="summary-meter-chapters" class="seg chapters"></span>
          <span id="summary-meter-model" class="seg model"></span>
        </div>
      </div>
    </section>

    <section id="storage-view" hidden aria-labelledby="storage-title">
      <h2 id="storage-title">Stored on this device</h2>
      <div class="card">
        <div class="card-head">
          <span>Total</span>
          <strong id="storage-total">…</strong>
        </div>
        <div class="meter" id="meter" role="img" aria-label="Storage in use">
          <span id="meter-chapters" class="seg chapters"></span>
          <span id="meter-model" class="seg model"></span>
        </div>
        <ul class="storage-rows">
          <li>
            <span class="dot chapters" aria-hidden="true"></span>
            <div class="row-text">
              <b>Narrated chapters</b>
              <small id="chapters-meta">Checking…</small>
            </div>
            <button id="clear-chapters" class="clear" type="button" disabled>Clear</button>
          </li>
          <li>
            <span class="dot model" aria-hidden="true"></span>
            <div class="row-text">
              <b>Voice model</b>
              <small id="model-meta">Checking…</small>
            </div>
            <button id="clear-model" class="clear" type="button" disabled>Delete</button>
          </li>
        </ul>
      </div>
      <button id="clear-all" class="clear clear-all" type="button" disabled>Clear everything</button>
      <p id="storage-status" class="storage-status" role="status" aria-live="polite"></p>
      <button id="storage-back" class="primary quiet" type="button">Back</button>
    </section>

    <nav class="support-links" aria-label="Help and project links">
      <a
        href="https://github.com/abdullahkhfb/narrately/issues/new?template=bug_report.yml"
        target="_blank"
        rel="noopener noreferrer"
      >Report a bug</a>
      <button id="debug-open" type="button">Debug</button>
      <a
        href="https://github.com/abdullahkhfb/narrately"
        target="_blank"
        rel="noopener noreferrer"
      >Source</a>
    </nav>
  </main>
  <script type="module" src="./index.ts"></script>
</body>
</html>
