name: Release / verify

# Reusable stage: runs the Rust tests and the TypeScript typecheck against the
# release tag. Called by release.yml; not meant to be triggered directly.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to check out and verify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/setup-toolchain

      - name: Test and typecheck
        run: |
          cargo test --workspace
          npm run typecheck
